# ===== 窗口与界面 =====
title='${filename} - mpv'             # 窗口标题显示文件名
osd-font-size=10                      # 屏上显示字体大小

# ===== 播放行为 =====
save-position-on-quit=yes             # 退出时保存播放位置
keep-open=yes                         # 播放完毕后保持窗口打开
loop-playlist=inf                     # 播放列表无限循环
osd-playlist-entry=filename           # OSD 显示文件名而非视频标题
autocreate-playlist=same              # 打开视频时自动添加同目录文件

# ===== 音频 =====
volume=0                              # 默认音量为 0（静音）

# ===== 视频 =====
hwdec=auto-safe                       # 启用硬件解码
