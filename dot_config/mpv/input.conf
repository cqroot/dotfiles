# ===== 基础导航 =====
RIGHT   seek  5                        # 快进 5 秒
LEFT    seek -5                        # 快退 5 秒
UP      add volume 2                   # 音量 +2
DOWN    add volume -2                  # 音量 -2

# ===== 播放控制 =====
[       add speed -0.1                  # 速度减少 0.1
]       add speed 0.1                   # 速度增加 0.1
{       multiply speed 1/1.1            # 速度除以 1.1
}       multiply speed 1.1              # 速度乘以 1.1
BS      set speed 1.0                   # 重置为正常速度

# ===== 字幕微调 =====
t       add secondary-sub-pos -1        # 副字幕位置上移
T       add secondary-sub-pos +1        # 副字幕位置下移

# ===== 视频调整 =====
Ctrl+r  cycle_values video-rotate "90" "180" "270" "0"   # 视频旋转 90°

# ===== 播放列表 =====
Ctrl+l  show-text ${playlist} 3000                       # 显示播放列表
Ctrl+n  playlist-next ; show-text ${playlist} 3000       # 下一首
Ctrl+p  playlist-prev ; show-text ${playlist} 3000       # 上一首

Alt+s   show-text ${playlist} 3000                       # 显示播放列表
Alt+d   playlist-next ; show-text ${playlist} 3000       # 下一首
Alt+a   playlist-prev ; show-text ${playlist} 3000       # 上一首

Ctrl+e  playlist-next ; show-text ${playlist} 5          # 下一首
Ctrl+q  playlist-prev ; show-text ${playlist} 5          # 上一首

# ===== 触控/鼠标侧边栏 =====
AXIS_UP    add volume -2                                 # 音量 -2
AXIS_DOWN  add volume 2                                  # 音量 +2
AXIS_LEFT  seek 5                                        # 快进 5 秒
AXIS_RIGHT seek -5                                       # 快退 5 秒

# ===== 退出 =====
q  no-osd set idle yes ; stop                            # 静默退出
